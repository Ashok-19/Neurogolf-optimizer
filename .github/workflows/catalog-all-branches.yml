name: Catalog all NeuroGolf branch candidates
on:
  push:
    branches: [ensemble-all-branches-20260716]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ensemble-all-branches-20260716
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recreate exact ONNX environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnx==1.21.0 onnxruntime==1.24.4 numpy==2.4.4
      - name: Fetch and catalog every branch
        run: python ensemble_all_branches/inventory_repo_only.py
      - name: Export every candidate binary and adjacent validation evidence
        run: python ensemble_all_branches/export_all_candidates.py
      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-branch-candidate-catalog
          path: ensemble_all_branches/inventory
      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: all-branch-candidate-bundle
          path: ensemble_all_branches/candidate_bundle
      - name: Commit catalog on direct push only
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ensemble_all_branches/inventory
          git commit -m "Catalog every branch ONNX candidate"
          git push origin HEAD:ensemble-all-branches-20260716
